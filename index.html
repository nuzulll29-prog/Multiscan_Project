<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hana Memoria AR</title>
<script src="config.js"></script>
<style>
  html { background: #000; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  body { background: transparent; }
  #arbox { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: transparent; }
  .overlay { position: fixed; inset: 0; z-index: 2000000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
    background: linear-gradient(160deg, #3b2a3f, #1d1521); }
  .overlay h1 { margin: 0; font-size: 1.5rem; }
  .overlay p { margin: 0; opacity: .8; max-width: 320px; line-height: 1.5; font-size: .95rem; }
  button { border: 0; border-radius: 999px; padding: 14px 32px; font-size: 1rem; font-weight: 600;
    background: #f4b6c8; color: #3b2a3f; }
  button:disabled { opacity: .6; }
  #hint { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%); z-index: 2000000; padding: 10px 18px; border-radius: 999px;
    background: rgba(0,0,0,.55); font-size: .9rem; display: none; text-align: center; max-width: 85%; }
  #sound { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; z-index: 2000000;
    width: 44px; height: 44px; padding: 0; font-size: 1.2rem; display: none; background: rgba(0,0,0,.55); color: #fff; }
  #err { color: #ffb4b4; }
  #step { font-size: .85rem; opacity: .7; min-height: 1.2em; }
  .vids { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>

<div id="arbox"></div>

<div class="overlay" id="start">
  <h1>Hana Memoria</h1>
  <p id="msg">Arahkan kamera ke foto di frame untuk melihat video kenanganmu.</p>
  <p id="err"></p>
  <button id="startBtn">Mulai Scan</button>
  <p id="step"></p>
</div>

<div id="hint">Arahkan kamera ke salah satu foto di frame</div>
<button id="sound" aria-label="Suara">🔊</button>
<div class="vids" id="vids"></div>

<script>
// ====== KONFIGURASI ======
// URL publik bucket R2 (r2.dev atau custom domain), tanpa garis miring di akhir.
const R2_BASE = (window.HM_CONFIG && window.HM_CONFIG.r2Base) || "https://GANTI-DENGAN-DOMAIN-R2";
// Jumlah foto/target di frame. Bisa diubah lewat URL: ?order=ABC123&n=12
const DEFAULT_TARGET_COUNT = 12;
const MAX_LOADED_VIDEOS = 3;   // batasi video yang tersimpan di memori (HP low-end)
const MAX_RETRY = 3;
// =========================

const params = new URLSearchParams(location.search);
const ORDER = params.get("order");
const N = parseInt(params.get("n") || DEFAULT_TARGET_COUNT, 10);
const pad = (i) => String(i + 1).padStart(2, "0");

const $ = (id) => document.getElementById(id);
const startEl = $("start"), startBtn = $("startBtn"), errEl = $("err"),
      stepEl = $("step"), hintEl = $("hint"), soundBtn = $("sound");

function setStep(t) { stepEl.textContent = t || ""; }
function showError(text) {
  errEl.textContent = text;
  startEl.style.display = "flex";
  startBtn.disabled = false;
  startBtn.textContent = "Coba Lagi";
}

window.addEventListener("unhandledrejection", (e) => {
  const m = e.reason && e.reason.message ? e.reason.message : String(e.reason);
  setStep("Error: " + m);
});

// ---------- muat library AR (dengan cadangan kalau CDN utama gagal) ----------
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error("gagal memuat " + src));
    document.head.appendChild(s);
  });
}
async function loadFirst(urls, check) {
  for (const u of urls) {
    try { await loadScript(u); if (check()) return; } catch (e) { console.warn(e.message); }
  }
  throw new Error("Library AR gagal dimuat. Periksa internet, atau coba ganti WiFi / data seluler.");
}
async function loadLibs() {
  await loadFirst([
    "aframe.min.js", // salinan di repo sendiri (utama)
    "https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js",
    "https://unpkg.com/aframe@1.5.0/dist/aframe.min.js",
  ], () => !!window.AFRAME);
  await loadFirst([
    "mindar-image-aframe.prod.js", // salinan di repo sendiri (utama)
    "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js",
    "https://unpkg.com/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js",
  ], () => !!window.MINDAR);
}

async function bootstrap() {
  startBtn.disabled = true;
  startBtn.textContent = "Memuat…";
  setStep("Memuat library AR…");
  try {
    await loadLibs();
  } catch (e) {
    errEl.textContent = e.message;
    startBtn.disabled = false;
    startBtn.textContent = "Muat Ulang";
    startBtn.onclick = () => location.reload();
    setStep("");
    return;
  }
  setStep("");
  init();
  startBtn.disabled = false;
  startBtn.textContent = "Mulai Scan";
}

if (!ORDER) {
  errEl.textContent = "Link tidak valid. Scan ulang QR code pada produkmu.";
  startBtn.style.display = "none";
} else {
  bootstrap();
}

async function testCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error("Browser ini tidak mendukung kamera. Buka lewat Chrome dan pastikan alamatnya https.");
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    stream.getTracks().forEach((t) => t.stop());
  } catch (e) {
    if (e.name === "NotAllowedError") {
      throw new Error("Izin kamera ditolak. Ketuk ikon di sebelah alamat → Izin → Kamera → Izinkan, lalu muat ulang.");
    }
    if (e.name === "NotFoundError") throw new Error("Kamera tidak ditemukan di perangkat ini.");
    if (e.name === "NotReadableError") throw new Error("Kamera sedang dipakai aplikasi atau tab lain. Tutup dulu, lalu coba lagi.");
    throw new Error("Kamera gagal dibuka (" + e.name + ").");
  }
}

function init() {
  const base = `${R2_BASE}/orders/${encodeURIComponent(ORDER)}`;
  const videos = [];        // elemen <video> per target
  const planes = [];        // plane A-Frame per target
  const found = new Set();  // target yang sedang terlihat
  const loadedOrder = [];   // urutan video yang sudah dimuat (LRU)
  let muted = false;

  // ----- scene -----
  const scene = document.createElement("a-scene");
  scene.setAttribute("mindar-image",
    `imageTargetSrc: ${base}/targets.mind; autoStart: false; maxTrack: 2; ` +
    `uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0005; filterBeta: 0.005;`);
  scene.setAttribute("color-space", "sRGB");
  scene.setAttribute("vr-mode-ui", "enabled: false");
  scene.setAttribute("device-orientation-permission-ui", "enabled: false");
  scene.setAttribute("embedded", "");
  scene.style.cssText = "position:absolute;inset:0;width:100%;height:100%;";

  const cam = document.createElement("a-camera");
  cam.setAttribute("position", "0 0 0");
  cam.setAttribute("look-controls", "enabled: false");
  scene.appendChild(cam);

  for (let i = 0; i < N; i++) {
    const v = document.createElement("video");
    v.id = `v${i}`;
    v.setAttribute("playsinline", "");
    v.setAttribute("webkit-playsinline", "");
    v.crossOrigin = "anonymous";
    v.preload = "none";
    v.loop = true;
    v.dataset.retry = "0";
    $("vids").appendChild(v);
    videos.push(v);

    const ent = document.createElement("a-entity");
    ent.setAttribute("mindar-image-target", `targetIndex: ${i}`);

    const plane = document.createElement("a-entity");
    plane.setAttribute("geometry", "primitive: plane; width: 1; height: 0.75");
    plane.setAttribute("material", `shader: flat; src: #v${i}; transparent: true`);
    plane.setAttribute("visible", "false");
    ent.appendChild(plane);
    planes.push(plane);

    ent.addEventListener("targetFound", () => onFound(i));
    ent.addEventListener("targetLost", () => onLost(i));
    scene.appendChild(ent);

    v.addEventListener("loadedmetadata", () => {
      if (v.videoWidth) plane.setAttribute("geometry", "height", v.videoHeight / v.videoWidth);
    });
    v.addEventListener("playing", () => {
      if (found.has(i)) { plane.setAttribute("visible", "true"); hintEl.style.display = "none"; }
    });
    v.addEventListener("waiting", () => {
      if (found.has(i)) { hintEl.textContent = "Memuat video…"; hintEl.style.display = "block"; }
    });
    v.addEventListener("error", () => retryVideo(i));
  }

  $("arbox").appendChild(scene);

  // ----- logika video -----
  function videoUrl(i) { return `${base}/videos/${pad(i)}.mp4`; }

  function loadVideo(i) {
    const v = videos[i];
    if (!v.getAttribute("src")) { v.src = videoUrl(i); v.load(); }
    const idx = loadedOrder.indexOf(i);
    if (idx !== -1) loadedOrder.splice(idx, 1);
    loadedOrder.push(i);
    while (loadedOrder.length > MAX_LOADED_VIDEOS) {
      const old = loadedOrder.find((k) => !found.has(k));
      if (old === undefined) break;
      loadedOrder.splice(loadedOrder.indexOf(old), 1);
      const ov = videos[old];
      ov.pause(); ov.removeAttribute("src"); ov.load();
    }
  }

  function playVideo(i) {
    const v = videos[i];
    v.muted = muted;
    const p = v.play();
    if (p && p.catch) {
      p.catch(() => {
        v.muted = true; muted = true; updateSoundBtn();
        v.play().catch(() => {});
      });
    }
  }

  function retryVideo(i) {
    const v = videos[i];
    const n = parseInt(v.dataset.retry, 10);
    if (!v.getAttribute("src") || n >= MAX_RETRY) {
      if (found.has(i)) { hintEl.textContent = "Video gagal dimuat. Periksa koneksi internet."; hintEl.style.display = "block"; }
      return;
    }
    v.dataset.retry = String(n + 1);
    setTimeout(() => { v.src = videoUrl(i); v.load(); if (found.has(i)) playVideo(i); }, 1500 * (n + 1));
  }

  function onFound(i) {
    found.add(i);
    hintEl.style.display = "none";
    videos[i].dataset.retry = "0";
    loadVideo(i);
    playVideo(i);
  }

  function onLost(i) {
    found.delete(i);
    planes[i].setAttribute("visible", "false");
    videos[i].pause();
    if (found.size === 0) {
      hintEl.textContent = "Arahkan kamera ke salah satu foto di frame";
      hintEl.style.display = "block";
    }
  }

  // ----- suara -----
  function updateSoundBtn() { soundBtn.textContent = muted ? "🔇" : "🔊"; }
  soundBtn.addEventListener("click", () => {
    muted = !muted;
    updateSoundBtn();
    found.forEach((i) => { videos[i].muted = muted; });
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) videos.forEach((v) => v.pause());
    else found.forEach((i) => playVideo(i));
  });

  // ----- start / error -----
  scene.addEventListener("arError", () => {
    showError("Kamera atau file AR tidak bisa dibuka. Izinkan akses kamera dan pastikan internet aktif.");
  });
  scene.addEventListener("arReady", () => {
    setStep("");
    startEl.style.display = "none";
    hintEl.textContent = "Arahkan kamera ke salah satu foto di frame";
    hintEl.style.display = "block";
    soundBtn.style.display = "block";
  });

  startBtn.addEventListener("click", async () => {
    errEl.textContent = "";
    startBtn.disabled = true;
    startBtn.textContent = "Menyiapkan kamera…";
    try {
      if (R2_BASE.includes("GANTI")) {
        throw new Error("Alamat R2 belum diisi. Isi r2Base di file config.js.");
      }

      setStep("1/3 Mengecek file AR…");
      let head;
      try {
        head = await fetch(`${base}/targets.mind`, { method: "HEAD", cache: "no-store" });
      } catch (_) {
        throw new Error("Tidak bisa mengambil file AR. Periksa alamat R2 dan pengaturan CORS bucket.");
      }
      if (head.status === 404) throw new Error("File AR untuk order ini belum siap. Tunggu kompilasi selesai, lalu coba lagi.");
      if (!head.ok) throw new Error("File AR gagal dimuat (kode " + head.status + ").");

      setStep("2/3 Izinkan kamera jika diminta…");
      await testCamera();

      setStep("3/3 Menyalakan AR…");
      if (!scene.hasLoaded) {
        await Promise.race([
          new Promise((res) => scene.addEventListener("loaded", res, { once: true })),
          new Promise((_, rej) => setTimeout(() => rej(new Error("A-Frame tidak siap. Muat ulang halaman.")), 15000)),
        ]);
      }
      const sys = scene.systems && scene.systems["mindar-image-system"];
      if (!sys) throw new Error("Modul MindAR tidak aktif. Muat ulang halaman.");
      await Promise.race([
        sys.start(),
        new Promise((_, rej) => setTimeout(() => rej(new Error("Terlalu lama menyiapkan AR. Muat ulang halaman, lalu coba lagi.")), 30000)),
      ]);
    } catch (e) {
      console.error(e);
      setStep("");
      showError(e.message || "Gagal memulai AR. Izinkan akses kamera lalu coba lagi.");
    }
  });
}
</script>
</body>
</html>
