<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kirim Foto dan Video</title>
<style>
  :root { --bg:#faf6f8; --ink:#2b2030; --mute:#7a6d80; --pink:#e58fae; --line:#ece3e8; --ok:#2e9e6a; --bad:#d64545; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:18px 16px 48px; max-width:560px; margin-inline:auto; }
  h1 { font-size:1.3rem; margin:6px 0 4px; }
  p { color:var(--mute); line-height:1.5; margin:6px 0 14px; font-size:.92rem; }
  .slot { background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px; }
  .slot b { font-size:.9rem; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .pick { aspect-ratio:3/4; border:1px dashed #cdbcc6; border-radius:10px; background:#f3e9ee; color:var(--mute); font:600 .85rem system-ui; padding:6px; overflow:hidden; word-break:break-all; }
  .pick.ok { border-style:solid; border-color:var(--ok); color:var(--ink); }
  .pick img { width:100%; height:100%; object-fit:cover; border-radius:6px; }
  #go { width:100%; border:0; border-radius:12px; padding:15px; font:700 1rem system-ui; background:var(--pink); color:#fff; margin-top:6px; }
  #go:disabled { opacity:.5; }
  #bar { height:8px; background:#f0e6eb; border-radius:99px; overflow:hidden; margin:14px 0 8px; display:none; }
  #bar i { display:block; height:100%; width:0; background:var(--pink); transition:width .2s; }
  #msg { font-size:.9rem; line-height:1.5; }
</style>
</head>
<body>
<h1>Kirim Foto dan Video</h1>
<p id="info">Pilih satu foto dan satu video untuk setiap pasangan, lalu tekan Kirim. Jangan tutup halaman sampai muncul tulisan selesai.</p>
<p><a id="toPoster" href="#">Sudah mengirim? Pilih desain poster »</a></p>
<div id="slots"></div>
<button id="go" type="button">Kirim</button>
<div id="bar"><i></i></div>
<div id="msg"></div>

<script>
const WORKER_URL = "https://hana-multiscan.nuzulll-29.workers.dev"; // alamat Worker, tanpa / di akhir
const CHUNK = 6 * 1048576;
const Q = new URLSearchParams(location.search), N = parseInt(Q.get("n"), 10) || 0, ORDER = Q.get("o") || "";
const AUTH = "o=" + encodeURIComponent(ORDER) + "&n=" + N + "&e=" + encodeURIComponent(Q.get("e") || "") + "&t=" + encodeURIComponent(Q.get("t") || "");
const $ = (id) => document.getElementById(id), pad = (i) => String(i + 1).padStart(2, "0");
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const slots = Array.from({ length: N }, () => ({ photo: null, video: null, thumb: "", vn: "" }));
const say = (t, c) => { $("msg").textContent = t; $("msg").style.color = c || "inherit"; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function retry(fn) { for (let t = 0; ; t++) { try { return await fn(); } catch (e) { if (t >= 2) throw e; await wait(1500 * (t + 1)); } } }

function render() {
  $("slots").innerHTML = slots.map((s, i) => `<div class="slot"><b>Pasangan ${i + 1}</b><div class="pair">` +
    `<button class="pick ${s.photo ? "ok" : ""}" data-k="photo" data-i="${i}">${s.thumb ? `<img src="${s.thumb}" alt="" onerror="this.replaceWith('Foto dipilih')">` : "Pilih foto"}</button>` +
    `<button class="pick ${s.video ? "ok" : ""}" data-k="video" data-i="${i}">${s.video ? "▶ " + esc(s.vn) : "Pilih video"}</button></div></div>`).join("");
}
$("slots").addEventListener("click", (e) => {
  const b = e.target.closest(".pick");
  if (!b) return;
  const i = +b.dataset.i, k = b.dataset.k, inp = document.createElement("input");
  inp.type = "file"; inp.accept = k === "photo" ? "image/*" : "video/*";
  inp.onchange = async () => {
    const f = inp.files[0];
    if (!f) return;
    try {
      const blob = new Blob([await f.arrayBuffer()], { type: f.type || (k === "photo" ? "image/jpeg" : "video/mp4") }); // dibaca sekarang supaya tidak gagal nanti
      if (k === "photo") { if (blob.size > 10 * 1048576) return say("Foto maksimal 10 MB.", "var(--bad)"); slots[i].photo = blob; slots[i].thumb = URL.createObjectURL(blob); }
      else { if (blob.size > 100 * 1048576) return say("Video maksimal 100 MB.", "var(--bad)"); slots[i].video = blob; slots[i].vn = f.name; }
      say(""); render();
    } catch (_) { say("File tidak bisa dibaca. Coba pilih ulang dari folder Download.", "var(--bad)"); }
  };
  inp.click();
});

async function api(path, body) {
  const r = await fetch(`${WORKER_URL}/c/${path}?${AUTH}`, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Error " + r.status);
  return d;
}
function post(url, fields, blob, headers, onp) {
  return new Promise((res, rej) => {
    const fd = new FormData(), x = new XMLHttpRequest();
    Object.entries(fields).forEach(([k, v]) => fd.append(k, v));
    fd.append("file", blob);
    x.open("POST", url);
    Object.entries(headers).forEach(([k, v]) => x.setRequestHeader(k, v));
    x.upload.onprogress = (e) => { if (e.lengthComputable) onp(e.loaded / e.total); };
    x.onload = () => { let d = {}; try { d = JSON.parse(x.responseText); } catch (_) {} x.status < 300 ? res(d) : rej(new Error((d.error && d.error.message) || "Gagal mengirim (" + x.status + ")")); };
    x.onerror = () => rej(new Error("Koneksi terputus"));
    x.send(fd);
  });
}
async function up(kind, name, blob, onp) {
  const sg = await api("sign", { order: ORDER, kind, name });
  const url = `https://api.cloudinary.com/v1_1/${sg.cloudName}/${sg.resourceType}/upload`, f = { api_key: sg.apiKey, ...sg.params, signature: sg.signature };
  if (kind === "photos" || blob.size <= CHUNK) return post(url, f, blob, {}, onp);
  const id = (crypto.randomUUID && crypto.randomUUID()) || Date.now() + "-" + Math.random();
  for (let s = 0; s < blob.size; s += CHUNK) {
    const e = Math.min(s + CHUNK, blob.size);
    await retry(() => post(url, f, blob.slice(s, e), { "X-Unique-Upload-Id": id, "Content-Range": `bytes ${s}-${e - 1}/${blob.size}` }, (x) => onp((s + x * (e - s)) / blob.size)));
  }
}
async function ingest(kind, name) {
  for (let t = 0; t < 150; t++) {
    const r = await retry(() => api("ingest", { order: ORDER, kind, name }));
    if (r.status === "done") return;
    await wait(2000);
  }
  throw new Error("Pemrosesan terlalu lama. Silakan coba lagi.");
}

$("go").onclick = async () => {
  if (slots.some((s) => !s.photo || !s.video)) return say("Lengkapi dulu semua foto dan video di setiap pasangan.", "var(--bad)");
  if (!confirm(`Kirim ${N} pasangan foto dan video? Setelah dikirim tidak bisa diubah lagi.`)) return;
  $("go").disabled = true;
  $("bar").style.display = "block";
  say("Mengirim… jangan tutup halaman ini.");
  const jobs = [];
  slots.forEach((s, i) => jobs.push(["photos", pad(i) + ".jpg", s.photo]));
  slots.forEach((s, i) => jobs.push(["videos", pad(i) + ".mp4", s.video]));
  const prog = jobs.map(() => 0);
  let next = 0, fail = null;
  const bar = () => { $("bar").firstChild.style.width = (prog.reduce((a, b) => a + b, 0) / jobs.length) * 100 + "%"; };
  const worker = async () => {
    while (!fail && next < jobs.length) {
      const j = next++, [k, n, b] = jobs[j];
      try { await retry(() => up(k, n, b, (f) => { prog[j] = f * 0.7; bar(); })); await ingest(k, n); prog[j] = 1; bar(); } catch (e) { fail = e; }
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  if (fail) { say("Belum berhasil: " + fail.message + " Tekan Kirim untuk mencoba lagi.", "var(--bad)"); $("go").disabled = false; return; }
  try {
    await api("submit", {});
    $("slots").style.display = $("go").style.display = $("bar").style.display = "none";
    $("info").textContent = "";
    say("Terima kasih! Foto dan video sudah terkirim. Sekarang pilih desain posternya…", "var(--ok)");
    setTimeout(() => { location.href = "poster.html" + location.search; }, 1800);
  } catch (e) { say(e.message, "var(--bad)"); $("go").disabled = false; }
};

$("toPoster").href = "poster.html" + location.search;
if (!ORDER || !N) { say("Link tidak valid.", "var(--bad)"); $("slots").style.display = $("go").style.display = "none"; }
else {
  render();
  api("status").catch((e) => { say(e.message, "var(--bad)"); $("slots").style.display = $("go").style.display = "none"; });
}
</script>
</body>
</html>
