<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Upload Order AR - Hana Memoria</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --bg:#faf6f8; --card:#fff; --ink:#2b2030; --mute:#7a6d80; --pink:#e58fae; --line:#ece3e8; --ok:#2e9e6a; --bad:#d64545; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px)); max-width:560px; margin-inline:auto; }
  h1 { font-size:1.25rem; margin:4px 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:.85rem; color:var(--mute); margin:10px 0 4px; }
  label:first-child { margin-top:0; }
  input[type=text], input[type=password], input[type=number] { width:100%; padding:12px; font-size:1rem; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  button { border:0; border-radius:10px; padding:12px 14px; font-size:.95rem; font-weight:600; background:var(--pink); color:#fff; }
  button.ghost { background:#f3e9ee; color:var(--ink); }
  button.small { padding:8px 10px; font-size:.8rem; }
  button:disabled { opacity:.5; }
  .slot { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .slot:first-of-type { border-top:0; }
  .num { width:24px; text-align:center; font-weight:700; color:var(--mute); }
  .thumb { width:52px; height:52px; border-radius:8px; background:#f3e9ee; object-fit:cover; flex:none; }
  .meta { flex:1; min-width:0; font-size:.8rem; color:var(--mute); }
  .meta b { display:block; color:var(--ink); font-size:.82rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btns { display:flex; flex-direction:column; gap:4px; }
  .bar { height:8px; background:#f0e6eb; border-radius:99px; overflow:hidden; margin:10px 0; }
  .bar > i { display:block; height:100%; width:0; background:var(--pink); transition:width .2s; }
  #log { font-size:.82rem; line-height:1.6; max-height:200px; overflow:auto; }
  #log .ok { color:var(--ok); } #log .bad { color:var(--bad); }
  #result { display:none; text-align:center; }
  #qr { display:inline-block; padding:10px; background:#fff; margin:10px 0; }
  .link { word-break:break-all; font-size:.85rem; background:#f7f0f4; padding:10px; border-radius:10px; margin:8px 0; }
  .chk { display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--mute); margin-top:10px; }
  .chk input { width:18px; height:18px; }
</style>
</head>
<body>

<h1>Upload Order AR</h1>

<div class="card">
  <label for="pw">Password</label>
  <input type="password" id="pw" autocomplete="current-password" placeholder="Password upload">

  <label for="order">Kode order</label>
  <div class="row">
    <input type="text" id="order" placeholder="contoh: HM001" autocapitalize="characters" style="flex:2">
    <button class="ghost" id="genBtn" type="button">Buat kode</button>
  </div>

  <label for="count">Jumlah foto di frame</label>
  <input type="number" id="count" min="1" max="24" value="12" inputmode="numeric">
</div>

<div class="card">
  <div class="row">
    <button class="ghost" id="bulkPhoto" type="button">Pilih banyak foto</button>
    <button class="ghost" id="bulkVideo" type="button">Pilih banyak video</button>
  </div>
  <label class="chk"><input type="checkbox" id="sortName" checked> Urutkan menurut nama file saat pilih banyak</label>
  <p style="font-size:.8rem;color:var(--mute);margin:10px 0 0">Foto dan video dengan nomor yang sama akan menjadi pasangan. Kalau urutan salah, ganti per baris di bawah.</p>
</div>

<div class="card" id="slots"></div>

<div class="card">
  <button id="goBtn" style="width:100%">Upload &amp; Proses</button>
  <button id="recompileBtn" class="ghost" style="width:100%;margin-top:8px">Proses ulang saja (tanpa upload)</button>
  <div class="bar"><i id="barFill"></i></div>
  <div id="log"></div>
</div>

<div class="card" id="result">
  <div style="font-weight:700;color:var(--ok)">Siap dipakai!</div>
  <div id="qr"></div>
  <div class="link" id="linkText"></div>
  <div class="row">
    <button class="ghost" id="copyBtn" type="button">Salin link</button>
    <button id="openBtn" type="button">Buka halaman scan</button>
  </div>
</div>

<input type="file" id="picker" hidden>

<script>
// ====== KONFIGURASI (wajib diisi) ======
const WORKER_URL = "https://hana-multiscan.nuzulll-29.workers.dev"; // tanpa / di akhir
const SCAN_URL   = "https://nuzulll29-prog.github.io/Multiscan_Project/index.html"; // halaman scan pembeli
// =======================================

const CHUNK_MB = 6;            // video dipotong per sekian MB (minimal 5 MB, aturan Cloudinary)
const MAX_PHOTO_MB = 10;       // batas file foto di akun gratis Cloudinary
const MAX_VIDEO_MB = 100;      // batas file video di akun gratis Cloudinary
const POLL_MS = 10000;
const POLL_MAX_MIN = 30;

const $ = (id) => document.getElementById(id);
const pad = (i) => String(i + 1).padStart(2, "0");

let slots = []; // { photo: File|null, video: File|null, thumb: url|null }
let busy = false;

// ---------- UI dasar ----------
$("pw").value = sessionStorage.getItem("hm_pw") || "";
$("pw").addEventListener("input", () => sessionStorage.setItem("hm_pw", $("pw").value));
$("genBtn").addEventListener("click", () => {
  $("order").value = "HM" + Date.now().toString(36).toUpperCase().slice(-5);
});
$("count").addEventListener("change", () => { resizeSlots(); renderSlots(); });

function count() {
  const n = parseInt($("count").value, 10);
  return Math.min(24, Math.max(1, isNaN(n) ? 12 : n));
}
function resizeSlots() {
  const n = count();
  while (slots.length < n) slots.push({ photo: null, video: null, thumb: null });
  slots.length = n;
}

function log(text, cls) {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}
function setBar(frac) { $("barFill").style.width = Math.round(frac * 100) + "%"; }
function setBusy(b) {
  busy = b;
  $("goBtn").disabled = b; $("recompileBtn").disabled = b;
}

// ---------- slot ----------
function renderSlots() {
  const box = $("slots");
  box.innerHTML = "";
  slots.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "slot";
    row.innerHTML =
      `<div class="num">${i + 1}</div>` +
      (s.thumb ? `<img class="thumb" src="${s.thumb}" alt="">` : `<div class="thumb"></div>`) +
      `<div class="meta"><b>${s.photo ? esc(s.photo.name) : "Foto belum dipilih"}</b>` +
      `<b>${s.video ? esc(s.video.name) + " (" + mb(s.video.size) + ")" : "Video belum dipilih"}</b></div>` +
      `<div class="btns"><button class="ghost small" data-k="photo" data-i="${i}" type="button">Foto</button>` +
      `<button class="ghost small" data-k="video" data-i="${i}" type="button">Video</button></div>`;
    box.appendChild(row);
  });
  box.querySelectorAll("button").forEach((b) =>
    b.addEventListener("click", () => pickOne(b.dataset.k, parseInt(b.dataset.i, 10)))
  );
}
function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function mb(n) { return (n / 1048576).toFixed(1) + " MB"; }

// Baca file langsung saat dipilih, selagi izin akses dari Android masih aktif.
async function setFile(i, kind, file) {
  const s = slots[i];
  if (kind === "photo") {
    const data = await file.arrayBuffer(); // melempar error kalau file tidak bisa dibaca
    const blob = new Blob([data], { type: file.type || "image/jpeg" });
    if (s.thumb) URL.revokeObjectURL(s.thumb);
    s.photo = file;
    s.photoData = blob;
    s.thumb = URL.createObjectURL(blob);
  } else {
    await file.slice(0, 1024).arrayBuffer(); // tes baca; video besar dibaca per potongan saat upload
    s.video = file;
  }
}

function alertUnreadable(names) {
  alert(
    "File ini tidak bisa dibaca oleh browser:\n" + names.join("\n") +
    "\n\nCoba pilih lewat aplikasi File Saya / Files (bukan Galeri), atau salin file ke folder Download dulu. " +
    "Pastikan juga Chrome punya izin Foto dan video."
  );
}

const picker = $("picker");
function openPicker(accept, multiple, onFiles) {
  picker.value = "";
  picker.accept = accept;
  picker.multiple = multiple;
  picker.onchange = () => { if (picker.files.length) onFiles(Array.from(picker.files)); };
  picker.click();
}
function pickOne(kind, i) {
  openPicker(kind === "photo" ? "image/*" : "video/*", false, async (files) => {
    try { await setFile(i, kind, files[0]); }
    catch (_) { alertUnreadable([files[0].name]); }
    renderSlots();
  });
}
function pickBulk(kind) {
  openPicker(kind === "photo" ? "image/*" : "video/*", true, async (files) => {
    if ($("sortName").checked) {
      files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    }
    if (files.length > slots.length) {
      alert(`Kamu memilih ${files.length} file, tetapi jumlah foto di frame hanya ${slots.length}. Kelebihannya diabaikan.`);
    }
    const list = files.slice(0, slots.length);
    const failed = [];
    for (let i = 0; i < list.length; i++) {
      try { await setFile(i, kind, list[i]); } catch (_) { failed.push(list[i].name); }
    }
    renderSlots();
    if (failed.length) alertUnreadable(failed);
  });
}
$("bulkPhoto").addEventListener("click", () => pickBulk("photo"));
$("bulkVideo").addEventListener("click", () => pickBulk("video"));

// ---------- jaringan ----------
function authHeader() { return { Authorization: "Bearer " + $("pw").value }; }

async function api(path, opts = {}) {
  const res = await fetch(WORKER_URL + path, { ...opts, headers: { ...authHeader(), ...(opts.headers || {}) } });
  let data = {};
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

function uuid() {
  return (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
}

// Android kadang gagal membaca file langsung dari galeri saat dikirim.
// Salin ke memori dulu supaya pengiriman stabil.
async function toMemory(blob) {
  try {
    const buf = await blob.arrayBuffer();
    return new Blob([buf], { type: blob.type || "application/octet-stream" });
  } catch (_) {
    throw new Error("File tidak bisa dibaca browser. Pilih ulang file lewat aplikasi Files (bukan Galeri) atau salin ke folder Download dulu.");
  }
}

// kirim satu potongan (atau file utuh) ke Cloudinary
function postToCloudinary(url, fields, blob, headers, onProgress) {
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    Object.entries(fields).forEach(([k, v]) => fd.append(k, v));
    fd.append("file", blob);
    const x = new XMLHttpRequest();
    x.open("POST", url);
    Object.entries(headers).forEach(([k, v]) => x.setRequestHeader(k, v));
    x.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => {
      let data = {};
      try { data = JSON.parse(x.responseText); } catch (_) {}
      if (x.status >= 200 && x.status < 300) return resolve(data);
      reject(new Error((data.error && data.error.message) || "Cloudinary error " + x.status));
    };
    x.onerror = () => reject(new Error("Koneksi ke Cloudinary terputus (status " + x.status + ")"));
    x.ontimeout = () => reject(new Error("Waktu kirim ke Cloudinary habis"));
    x.send(fd);
  });
}

async function withRetry(fn, times = 3) {
  let last;
  for (let t = 0; t < times; t++) {
    try { return await fn(); }
    catch (e) {
      last = e;
      if (/Password/i.test(e.message)) throw e;
      await new Promise((r) => setTimeout(r, 1500 * (t + 1)));
    }
  }
  throw last;
}

// upload ke Cloudinary. Video dipotong per CHUNK_MB, tiap potongan boleh diulang sendiri.
async function uploadToCloudinary(order, kind, name, file, onProgress) {
  const sign = await api("/sign", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ order, kind, name }),
  });
  const url = `https://api.cloudinary.com/v1_1/${sign.cloudName}/${sign.resourceType}/upload`;
  const fields = { api_key: sign.apiKey, ...sign.params, signature: sign.signature };
  const total = file.size;
  const chunk = CHUNK_MB * 1048576;

  if (kind === "photos" || total <= chunk) {
    const whole = await toMemory(file);
    return withRetry(() => postToCloudinary(url, fields, whole, {}, onProgress));
  }

  const id = uuid();
  let result = null;
  for (let start = 0; start < total; start += chunk) {
    const end = Math.min(start + chunk, total);
    const part = await toMemory(file.slice(start, end));
    const headers = {
      "X-Unique-Upload-Id": id,
      "Content-Range": `bytes ${start}-${end - 1}/${total}`,
    };
    result = await withRetry(() =>
      postToCloudinary(url, fields, part, headers, (f) => onProgress((start + f * (end - start)) / total))
    );
  }
  return result;
}

// Worker mengambil versi terkompresi dari Cloudinary, menyimpan ke R2, lalu menghapusnya di Cloudinary
async function ingest(order, kind, name) {
  const start = Date.now();
  const maxMs = kind === "videos" ? 4 * 60000 : 90000;
  while (Date.now() - start < maxMs) {
    const r = await withRetry(() =>
      api("/ingest", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ order, kind, name }),
      }), 2);
    if (r.status === "done") return r;
    await new Promise((res) => setTimeout(res, 4000));
  }
  throw new Error(`Cloudinary belum selesai memproses ${name}. Coba lagi.`);
}

// ---------- proses utama ----------
function validOrder() {
  const o = $("order").value.trim();
  if (!/^[A-Za-z0-9_-]{1,40}$/.test(o)) {
    alert("Kode order hanya boleh huruf, angka, - dan _ (maks 40 karakter).");
    return null;
  }
  if (!$("pw").value) { alert("Isi password dulu."); return null; }
  if (WORKER_URL.includes("GANTI-DENGAN")) { alert("WORKER_URL di upload.html belum diisi."); return null; }
  return o;
}

$("goBtn").addEventListener("click", async () => {
  const order = validOrder();
  if (!order) return;
  resizeSlots();

  const missingPhoto = slots.findIndex((s) => !s.photo);
  if (missingPhoto !== -1) { alert(`Foto nomor ${missingPhoto + 1} belum dipilih.`); return; }
  const missingVideo = slots.filter((s) => !s.video).length;
  if (missingVideo && !confirm(`${missingVideo} video belum dipilih. Lanjut tanpa video itu?`)) return;

  $("result").style.display = "none";
  $("log").innerHTML = "";
  setBar(0);
  setBusy(true);

  try {
    const jobs = [];
    slots.forEach((s, i) => {
      jobs.push({ kind: "photos", name: pad(i) + ".jpg", file: s.photoData || s.photo, label: `Foto ${i + 1}` });
      if (s.video) jobs.push({ kind: "videos", name: pad(i) + ".mp4", file: s.video, label: `Video ${i + 1}` });
    });

    for (let j = 0; j < jobs.length; j++) {
      const job = jobs[j];
      const limitMb = job.kind === "photos" ? MAX_PHOTO_MB : MAX_VIDEO_MB;
      if (job.file.size > limitMb * 1048576) {
        throw new Error(`${job.label} terlalu besar (${mb(job.file.size)}, maks ${limitMb} MB).`);
      }
      const part = (f) => setBar(((j + f) / jobs.length) * 0.7);

      log(`Mengunggah ${job.label} (${mb(job.file.size)})…`);
      await uploadToCloudinary(order, job.kind, job.name, job.file, (f) => part(f * 0.7));

      log(`${job.label}: dikompres, memindahkan ke R2…`);
      const r = await ingest(order, job.kind, job.name);
      part(1);
      log(
        `${job.label}: ${mb(job.file.size)} → ${mb(r.size)}` +
          (r.cleaned ? "" : " (file sementara di Cloudinary gagal dihapus)"),
        r.cleaned ? "ok" : "bad"
      );
    }
    log("Semua file sudah di R2.", "ok");
    await startCompileAndWait(order);
  } catch (e) {
    log(e.message, "bad");
  } finally {
    setBusy(false);
  }
});

$("recompileBtn").addEventListener("click", async () => {
  const order = validOrder();
  if (!order) return;
  $("result").style.display = "none";
  $("log").innerHTML = "";
  setBar(0.7);
  setBusy(true);
  try { await startCompileAndWait(order); }
  catch (e) { log(e.message, "bad"); }
  finally { setBusy(false); }
});

async function startCompileAndWait(order) {
  log("Memulai kompilasi di GitHub…");
  await api("/compile", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ order }),
  });
  log("Kompilasi berjalan. Tunggu 5-15 menit, halaman ini jangan ditutup.");

  const start = Date.now();
  let dots = 0;
  while (Date.now() - start < POLL_MAX_MIN * 60000) {
    await new Promise((r) => setTimeout(r, POLL_MS));
    let st;
    try { st = await api("/status?order=" + encodeURIComponent(order)); }
    catch (e) { continue; } // jaringan sempat putus, coba lagi
    const mins = Math.floor((Date.now() - start) / 60000);
    setBar(0.7 + Math.min(0.29, (Date.now() - start) / (POLL_MAX_MIN * 60000) * 0.29));
    if (st.ready) {
      setBar(1);
      log(`Selesai! (${st.photos} foto, ${st.videos} video, file AR ${(st.mindSize / 1024).toFixed(0)} KB)`, "ok");
      showResult(order);
      return;
    }
    if (++dots % 3 === 0) log(`Masih diproses… (${mins} menit)`);
  }
  log("Kompilasi belum selesai setelah 30 menit. Cek tab Actions di GitHub untuk melihat error-nya.", "bad");
}

function showResult(order) {
  let link = `${SCAN_URL}?order=${encodeURIComponent(order)}`;
  if (count() !== 12) link += `&n=${count()}`;
  $("linkText").textContent = link;
  $("qr").innerHTML = "";
  new QRCode($("qr"), { text: link, width: 220, height: 220 });
  $("result").style.display = "block";
  $("copyBtn").onclick = async () => {
    try { await navigator.clipboard.writeText(link); $("copyBtn").textContent = "Tersalin ✓"; }
    catch (_) { prompt("Salin link ini:", link); }
  };
  $("openBtn").onclick = () => window.open(link, "_blank");
  $("result").scrollIntoView({ behavior: "smooth" });
}

resizeSlots();
renderSlots();
</script>
</body>
</html>
